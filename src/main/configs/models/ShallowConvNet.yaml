# ShallowConvNet网络模型
model:
  name: 'ShallowConvNet'
  path: 'models'
  type: '2d'
  F1: 40
  T1: 25
  F2: 40
  P1_T: 75
  P1_S: 15
  drop_out: 0.5
  pool_mode: "max"
  # 可选参数 'normal_'、'xavier_uniform_'、'xavier_normal_'、
  # 'kaiming_uniform_'、'kaiming_normal_'
  weight_init_method: 'kaiming_normal_'
  last_dim: 1760

preprocess:
  augmentation: 1
  filter_bank: [[2, 20], [20, 40]]